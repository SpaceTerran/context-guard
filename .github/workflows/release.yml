name: Release

# A tag v* builds Context Guard for Windows and drafts a GitHub Release with it:
# context-guard-windows-x64.zip, what install.ps1 installs from, and its SHA-256. Check the draft,
# then publish it. Run by hand (Actions > Release > Run workflow), it builds the same zip and keeps
# it as the run's artifact, with no release. The Mac has nothing to download: install.sh builds it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build
    # Only SpaceTerran/context-guard releases, on GitHub-hosted runners. Its private copy shares this
    # file and skips it. Windows Server 2025 is the hosted image nearest Windows 11.
    if: github.repository == 'SpaceTerran/context-guard'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: windows/global.json
      - name: Toolchain
        run: swift --version && dotnet --version
      - name: Build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1
      # What the build made that nobody has signed: the programs, the app and the Swift runtime DLLs.
      # The Windows App SDK's DLLs come signed by Microsoft and are left as they are.
      - name: List what isn't signed
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $unsigned = @(Get-ChildItem -LiteralPath (Join-Path $dist 'context-guard') -Recurse -File -Include *.exe, *.dll |
            Where-Object { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne 'Valid' } |
            ForEach-Object { $_.FullName.Substring($dist.Length + 1) })
          Set-Content -LiteralPath (Join-Path $dist 'unsigned.txt') -Value $unsigned
          "$($unsigned.Count) files aren't signed:"
          $unsigned
      # Off: the project has no code signing account yet, so releases aren't signed and Smart App
      # Control blocks them. To sign them with Azure Artifact Signing, set the repository variables
      # WINDOWS_SIGNING (to artifact-signing), ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT and
      # ARTIFACT_SIGNING_PROFILE, and the secrets AZURE_TENANT_ID, AZURE_CLIENT_ID and
      # AZURE_CLIENT_SECRET.
      - name: Sign
        if: vars.WINDOWS_SIGNING == 'artifact-signing'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-catalog: ${{ github.workspace }}\dist\unsigned.txt
      - name: Zip
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -ZipOnly -ZipPath dist\release\context-guard-windows-x64.zip
      # In sha256sum's format, with a Unix line end, so `sha256sum -c` reads it too.
      - name: SHA-256
        shell: pwsh
        working-directory: dist/release
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath context-guard-windows-x64.zip).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'context-guard-windows-x64.zip.sha256'), "$hash  context-guard-windows-x64.zip`n")
          Get-Content -LiteralPath context-guard-windows-x64.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: context-guard-windows-x64
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft the release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: context-guard-windows-x64
          path: release
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" release/context-guard-windows-x64.zip release/context-guard-windows-x64.zip.sha256
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Context Guard $TAG"
          --notes-file .github/release-notes.md --generate-notes
